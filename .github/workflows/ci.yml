name: CI
# No `push` trigger on feature branches: the same commit would run twice (push + pull_request).
# No paths-ignore: main carries a ruleset that requires the `verify` check, so every PR must report it (the run takes ~40s).
# No `push` trigger on main: deploy.yaml calls this workflow on every push to main; a trigger here would run it twice.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:
permissions:
  contents: read
  issues: write
# A newer commit on the same PR cancels the stale run. Pushes to develop get a group of their own (run_id):
# a shared group keeps only one pending run, so a third fast merge would silently drop the second one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - run: bash scripts/verify.sh --full
      - name: Fail-loud on protected branch
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        # One open issue per red branch: later red pushes add a comment instead of opening another issue.
        run: |
          title="CI verify red on ${GITHUB_REF_NAME}"
          body="Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (commit ${GITHUB_SHA::7}). The protected branch is red: fix on develop or revert."
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
