name: CI
# No pull_request trigger: changes are verified locally before the PR (harness pre-push gate) and again here once they
# land on develop; main is verified by deploy.yaml through workflow_call before anything is built.
# No `push` trigger on main: deploy.yaml calls this workflow on every push to main; a trigger here would run it twice.
# paths-ignore: docs-only changes cannot affect the build (the main ruleset no longer requires a PR check).
on:
  push:
    branches: [develop]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_call:
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - run: bash scripts/verify.sh --full
      - name: Fail-loud on protected branch
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        # One open issue per red branch: later red pushes add a comment instead of opening another issue.
        run: |
          title="CI verify red on ${GITHUB_REF_NAME}"
          body="Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (commit ${GITHUB_SHA::7}). The protected branch is red: fix on develop or revert."
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
